<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matières - IMC Clarodaro</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #17365d;
    color: white;
    text-align: center;
    padding: 18px;
}

header h1 {
    margin: 0;
    font-size: 26px;
}

header p {
    margin: 5px 0 0;
}

.menu-principal {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    justify-content: center;
    padding: 10px;
    background: white;
}

.menu-principal button {
    border: 0;
    background: #e7e7e7;
    padding: 10px 14px;
    border-radius: 5px;
    cursor: pointer;
}

.menu-principal button.active {
    background: #17365d;
    color: white;
}

.container {
    max-width: 1100px;
    margin: 20px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    margin-bottom: 20px;
}

.form-grid {
    display: grid;
    grid-template-columns: 2fr 1fr auto;
    gap: 10px;
    align-items: end;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

input {
    width: 100%;
    padding: 10px;
    border: 1px solid #bbb;
    border-radius: 5px;
}

button {
    cursor: pointer;
}

.btn {
    border: 0;
    border-radius: 5px;
    padding: 10px 14px;
}

.btn-ajouter {
    background: #198754;
    color: white;
}

.btn-modifier {
    background: #0d6efd;
    color: white;
}

.btn-supprimer {
    background: #dc3545;
    color: white;
}

.btn-annuler {
    background: #6c757d;
    color: white;
}

.recherche {
    margin-bottom: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    border: 1px solid #ccc;
    padding: 10px;
    text-align: center;
}

th {
    background: #17365d;
    color: white;
}

.actions {
    display: flex;
    gap: 5px;
    justify-content: center;
    flex-wrap: wrap;
}

.message {
    display: none;
    padding: 10px;
    margin-bottom: 15px;
    border-radius: 5px;
    background: #d1e7dd;
    color: #0f5132;
}

@media (max-width: 700px) {
    .form-grid {
        grid-template-columns: 1fr;
    }

    table {
        font-size: 13px;
    }

    th,
    td {
        padding: 7px;
    }
}
</style>
</head>

<body>


<header class="entete-ecole">
    <div class="informations-ecole">
        <h1>Institution Mixte Clarodaro</h1>
        <p>Clarodaro, la clarté du savoir !</p>
    </div>

</header>

<nav class="menu-principal">

    <button onclick="ouvrirPage('index.html')">
        Élèves
    </button>

    <button class="active">
        Matières
    </button>

    <button onclick="ouvrirPage('resultats.html')">
        Résultats
    </button>

    <button onclick="ouvrirPage('finances.html')">
        Finances
    </button>

    <button onclick="ouvrirPage('personnel.html')">
        Personnel
    </button>

    <button onclick="ouvrirPage('annees-scolaires.html')">
        Année scolaire
    </button>

    <button onclick="ouvrirPage('vacances.html')">
        Vacances
    </button>

    <button onclick="ouvrirPage('pdg.html')">
        PDG
    </button>

</nav>

<div class="container">

    <div class="card">

        <h2 id="titreFormulaire">
            Ajouter une matière
        </h2>

        <div id="message" class="message"></div>

        <form id="formMatiere">

            <div class="form-grid">

                <div>
                    <label for="nomMatiere">
                        Nom de la matière
                    </label>

                    <input
                        type="text"
                        id="nomMatiere"
                        required
                        placeholder="Exemple : Mathématiques"
                    >
                </div>

                <div>
                    <label for="pointsMax">
                        Points Max
                    </label>

                    <input
                        type="number"
                        id="pointsMax"
                        min="1"
                        step="1"
                        required
                        placeholder="20"
                    >
                </div>

                <div>

                    <button
                        type="submit"
                        id="btnEnregistrer"
                        class="btn btn-ajouter"
                    >
                        Ajouter
                    </button>

                    <button
                        type="button"
                        id="btnAnnuler"
                        class="btn btn-annuler"
                        style="display:none;"
                        onclick="annulerModification()"
                    >
                        Annuler
                    </button>

                </div>

            </div>

        </form>

    </div>


    <div class="card">

        <h2>Liste des matières</h2>

        <div class="recherche">

            <input
                type="text"
                id="recherche"
                placeholder="Rechercher une matière..."
            >

        </div>


        <table>

            <thead>

                <tr>
                    <th>#</th>
                    <th>Matière</th>
                    <th>Points Max</th>
                    <th>Contrôle 1</th>
                    <th>Contrôle 2</th>
                    <th>Contrôle 3</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody id="tableauMatieres"></tbody>

        </table>

    </div>

</div>


<script src="secure-storage.js"></script>
<script src="auth.js"></script>
<script>

// Authentification serveur obligatoire.
document.addEventListener("DOMContentLoaded", async function () {
    const user = await IMCAuth.verifySession();
    if (!user) {
        window.location.href = "personnel.html";
        return;
    }
    await chargerMatieres();
});

let matieres = [];
let indexModification = -1;

async function apiJson(url, options = {}) {
    const response = await fetch(url, {
        credentials: "same-origin",
        headers: { "Accept": "application/json", "Content-Type": "application/json", ...(options.headers || {}) },
        ...options
    });
    let payload = null;
    try { payload = await response.json(); } catch (_) {}
    if (!response.ok || !payload || payload.success === false) {
        throw new Error((payload && payload.message) || "Erreur serveur.");
    }
    return payload;
}

async function chargerMatieres() {
    try {
        const payload = await apiJson("/api/subjects/index.php");
        matieres = Array.isArray(payload.subjects) ? payload.subjects : [];
        afficherMatieres();
    } catch (error) {
        afficherMessage(error.message);
    }
}

function afficherMatieres() {
    const tbody = document.getElementById("tableauMatieres");
    const recherche = document.getElementById("recherche").value.trim().toLowerCase();
    tbody.innerHTML = "";
    const liste = matieres.filter(m => String(m.name || "").toLowerCase().includes(recherche));
    if (!liste.length) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 7;
        td.textContent = "Aucune matière trouvée.";
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
    }
    liste.forEach((matiere, index) => {
        const realIndex = matieres.indexOf(matiere);
        const max = Number(matiere.coefficient) || 10;
        const tr = document.createElement("tr");
        [String(realIndex + 1), matiere.name, String(max), "0 – " + max, "0 – " + max, "0 – " + max].forEach(value => {
            const td = document.createElement("td");
            td.textContent = value;
            tr.appendChild(td);
        });
        const td = document.createElement("td");
        const actions = document.createElement("div");
        actions.className = "actions";
        const edit = document.createElement("button");
        edit.className = "btn btn-modifier";
        edit.textContent = "Modifier";
        edit.addEventListener("click", () => modifierMatiere(realIndex));
        const del = document.createElement("button");
        del.className = "btn btn-supprimer";
        del.textContent = "Supprimer";
        del.addEventListener("click", () => supprimerMatiere(realIndex));
        actions.append(edit, del);
        td.appendChild(actions);
        tr.appendChild(td);
        tbody.appendChild(tr);
    });
}

document.getElementById("formMatiere").addEventListener("submit", async function(event) {
    event.preventDefault();
    const permission = indexModification === -1 ? "matieres.create" : "matieres.update";
    if (!IMCAuth.requirePermission(permission)) {
        afficherMessage("Permission refusée.");
        return;
    }
    const nom = document.getElementById("nomMatiere").value.trim();
    const pointsMax = Number(document.getElementById("pointsMax").value);
    if (!nom) return afficherMessage("Veuillez entrer le nom de la matière.");
    if (!Number.isFinite(pointsMax) || pointsMax <= 0) return afficherMessage("Les Points Max doivent être supérieurs à zéro.");
    if (matieres.some((m, i) => i !== indexModification && String(m.name).trim().toLowerCase() === nom.toLowerCase())) {
        return afficherMessage("Cette matière existe déjà.");
    }
    try {
        if (indexModification === -1) {
            await apiJson("/api/subjects/index.php", {
                method: "POST",
                body: JSON.stringify({ name: nom, coefficient: pointsMax })
            });
            afficherMessage("La matière a été ajoutée.");
        } else {
            const matiere = matieres[indexModification];
            await apiJson("/api/subjects/index.php?id=" + encodeURIComponent(matiere.id), {
                method: "PATCH",
                body: JSON.stringify({ name: nom, coefficient: pointsMax })
            });
            afficherMessage("La matière a été modifiée.");
        }
        annulerModification();
        await chargerMatieres();
    } catch (error) {
        afficherMessage(error.message);
    }
});

function modifierMatiere(index) {
    const matiere = matieres[index];
    if (!matiere) return;
    document.getElementById("nomMatiere").value = matiere.name || "";
    document.getElementById("pointsMax").value = matiere.coefficient || "";
    indexModification = index;
    document.getElementById("titreFormulaire").textContent = "Modifier la matière";
    const bouton = document.getElementById("btnEnregistrer");
    bouton.textContent = "Modifier";
    bouton.className = "btn btn-modifier";
    document.getElementById("btnAnnuler").style.display = "inline-block";
    window.scrollTo({ top: 0, behavior: "smooth" });
}

function annulerModification() {
    indexModification = -1;
    document.getElementById("formMatiere").reset();
    document.getElementById("titreFormulaire").textContent = "Ajouter une matière";
    const bouton = document.getElementById("btnEnregistrer");
    bouton.textContent = "Ajouter";
    bouton.className = "btn btn-ajouter";
    document.getElementById("btnAnnuler").style.display = "none";
}

async function supprimerMatiere(index) {
    if (!IMCAuth.requirePermission("matieres.delete")) {
        alert("Permission refusée.");
        return;
    }
    const matiere = matieres[index];
    if (!matiere || !confirm('Voulez-vous archiver la matière "' + matiere.name + '" ?')) return;
    try {
        await apiJson("/api/subjects/index.php?id=" + encodeURIComponent(matiere.id), {
            method: "PATCH",
            body: JSON.stringify({ status: "ARCHIVED" })
        });
        await chargerMatieres();
        afficherMessage("La matière a été archivée.");
    } catch (error) {
        afficherMessage(error.message);
    }
}

document.getElementById("recherche").addEventListener("input", afficherMatieres);

function afficherMessage(texte) {
    const message = document.getElementById("message");
    message.textContent = texte;
    message.style.display = "block";
    setTimeout(() => { message.style.display = "none"; }, 2500);
}

function ouvrirPage(page) { window.location.href = page; }

</script>

</body>
</html>
