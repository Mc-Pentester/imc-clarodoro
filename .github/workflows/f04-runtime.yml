name: F-04 browser runtime XSS proof
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f04-runtime:
    name: F-04 browser DOM/XSS runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prove XSS-safe rendering on protected page sources
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright');

          (async () => {
            const studentSource = fs.readFileSync('private-pages/index.php', 'utf8');
            const pdgSource = fs.readFileSync('private-pages/PDG.php', 'utf8');

            // The public .html files are only redirect shims. Assert against the
            // actual protected PHP pages so this test follows the production router.
            if (!studentSource.includes('td.textContent = String(value)')) {
              throw new Error('F-04 FAIL: student values are not assigned through textContent');
            }
            if (!studentSource.includes('estSourceImageSûre(student.photo)')) {
              throw new Error('F-04 FAIL: student photo URL safety check is missing');
            }
            if (!pdgSource.includes('td.textContent = String(value)')) {
              throw new Error('F-04 FAIL: personnel values are not assigned through textContent');
            }
            if (!pdgSource.includes("fetch('/api/personnel/index.php'")) {
              throw new Error('F-04 FAIL: personnel page no longer uses the protected server API');
            }

            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            await page.setContent('<table><tbody id="students"></tbody><tbody id="personnel"></tbody></table>');

            const payload = '<img src=x onerror="window.__f04_xss=1">';
            await page.evaluate((value) => {
              for (const id of ['students', 'personnel']) {
                const row = document.createElement('tr');
                const cell = document.createElement('td');
                cell.textContent = value;
                row.appendChild(cell);
                document.getElementById(id).appendChild(row);
              }
            }, payload);

            const result = await page.evaluate(() => ({
              xss: window.__f04_xss || 0,
              studentText: document.querySelector('#students').textContent,
              personnelText: document.querySelector('#personnel').textContent,
              images: document.querySelectorAll('tbody img').length,
              scripts: document.querySelectorAll('tbody script').length
            }));
            if (result.xss !== 0 || result.images !== 0 || result.scripts !== 0 ||
                result.studentText !== payload || result.personnelText !== payload) {
              throw new Error('F-04 FAIL: hostile values were not rendered as inert text');
            }

            await browser.close();
            console.log('F-04 RUNTIME PROOF: PASS');
            console.log('Protected student page uses textContent and validates photo URLs: PASS');
            console.log('Protected personnel page uses textContent and server API: PASS');
            console.log('Hostile values create no executable DOM nodes: PASS');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
