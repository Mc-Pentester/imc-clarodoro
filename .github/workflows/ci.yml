name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: PHP and PowerShell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: git diff --check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          files="$(find . -type f -name '*.php' -not -path './.git/*')"
          if [ -z "$files" ]; then
            echo "No PHP files found."
            exit 0
          fi
          while IFS= read -r file; do
            echo "Checking $file"
            php -l "$file"
          done <<< "$files"

      - name: Verify sensitive HTML files contain no protected page content
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          routes = {
              "index.html": ("private-pages/index.php", "eleves.read", "<title>IMC-Clarodoro</title>"),
              "PDG.html": ("private-pages/PDG.php", "paies.read", "<title>PDG - IMC Clarodaro</title>"),
              "finances.html": ("private-pages/finances.php", "finances.read", "<title>Finances - IMC Clarodaro</title>"),
              "personnel.html": ("private-pages/personnel.php", "personnel.read", "<title>Gestion du Personnel - IMC Clarodaro</title>"),
              "badge.html": ("private-pages/badge.php", "badge.read", "<title>Badge élève - IMC Clarodaro</title>"),
              "payroll-recovery.html": ("private-pages/payroll-recovery.php", "paies.reconcile", "<title>Reprise des paies historiques — IMC-Clarodoro</title>"),
              "resultats.html": ("private-pages/resultats.php", "resultats.read", "<title>Résultats - IMC Clarodaro</title>"),
          }
          for public, (private, permission, marker) in routes.items():
              public_text = Path(public).read_text(encoding="utf-8")
              private_text = Path(private).read_text(encoding="utf-8")
              if marker in public_text:
                  raise SystemExit(f"Protected page title leaked in public stub: {public}")
              if len(public_text) > 1500:
                  raise SystemExit(f"Public stub unexpectedly large: {public}")
              if "imcRequirePageAccess" not in private_text or permission not in private_text:
                  raise SystemExit(f"Server authorization guard missing: {private}")
              if marker not in private_text:
                  raise SystemExit(f"Original page content missing from protected source: {private}")
          print("SENSITIVE PAGE SOURCE SEPARATION: PASS")
          PY

      - name: Audit HTML pages and JavaScript
        run: |
          set -euo pipefail
          node --version
          python3 scripts/audit-html-pages.py

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Path . -Recurse -File -Filter '*.ps1' |
            Where-Object { $_.FullName -notmatch '\\.git\\' }
          foreach ($file in $files) {
            Write-Host "Checking $($file.FullName)"
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("Line {0}, Column {1}: {2} :: {3}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text) }
              throw "PowerShell syntax error in $($file.FullName)"
            }
          }
