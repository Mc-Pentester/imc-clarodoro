name: WhatsApp PostgreSQL runtime proof

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whatsapp-migrations:
    name: WhatsApp migrations, constraints and audit trigger
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: imc_whatsapp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imc_whatsapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: imc_whatsapp_test
      PGUSER: postgres
      PGPASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: imc_whatsapp_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      WHATSAPP_SEND_ENABLED: "false"
      WHATSAPP_APP_SECRET: "whatsapp-ci-app-secret"
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: "whatsapp-ci-verify-token"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize isolated schema
        run: psql -X -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Prepare PDG role fixture for permission migration
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO roles (name, description) VALUES ('PDG', 'WhatsApp CI role fixture')
          ON CONFLICT (name) DO NOTHING;
          SQL

      - name: Apply WhatsApp migrations twice (idempotency proof)
        run: |
          set -euo pipefail
          for migration in \
            database/migrations/20261023100000_whatsapp_consent_foundation.sql \
            database/migrations/20261025100000_assign_whatsapp_manual_permissions.sql \
            database/migrations/20261023103000_whatsapp_consent_audit.sql \
            database/migrations/20261023110000_whatsapp_message_log.sql \
            database/migrations/20261025120000_whatsapp_manual_preparations.sql \
            database/migrations/20261109170000_f02_l_pdg_payroll_whatsapp_permissions.sql
          do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
          # Seed one legacy parent consent before the additive migration to prove backfill.
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO parents(id,last_name,first_name,phone)
          VALUES ('00000000-0000-4000-8000-000000009001','Backfill','Parent','+50937000001')
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO whatsapp_consents
            (parent_id,purpose,phone_e164,status,consent_source,consented_at)
          VALUES ('00000000-0000-4000-8000-000000009001','GENERAL','+50937000001','OPTED_IN','pre-migration fixture',NOW())
          ON CONFLICT (parent_id,purpose) DO NOTHING;
          SQL
          for pass in 1 2; do
            psql -X -v ON_ERROR_STOP=1 -f database/migrations/20261115150000_whatsapp_multi_recipient_consents.sql
          done

      - name: Verify PDG permissions are least-privilege
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $pdg$
          DECLARE pdg_role_id UUID;
          BEGIN
            SELECT id INTO pdg_role_id FROM roles WHERE name = 'PDG';
            IF pdg_role_id IS NULL THEN RAISE EXCEPTION 'PDG role missing'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM role_permissions rp JOIN permissions p ON p.id = rp.permission_id
              WHERE rp.role_id = pdg_role_id AND p.name = 'whatsapp.message.send'
            ) THEN RAISE EXCEPTION 'PDG lacks whatsapp.message.send'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM role_permissions rp JOIN permissions p ON p.id = rp.permission_id
              WHERE rp.role_id = pdg_role_id AND p.name = 'whatsapp.consent.read'
            ) THEN RAISE EXCEPTION 'PDG lacks whatsapp.consent.read'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM role_permissions rp JOIN permissions p ON p.id = rp.permission_id
              WHERE rp.role_id = pdg_role_id AND p.name = 'whatsapp.recipient.manage'
            ) THEN RAISE EXCEPTION 'PDG lacks whatsapp.recipient.manage'; END IF;
            IF NOT EXISTS (
              SELECT 1 FROM whatsapp_recipient_consents c
              WHERE c.parent_id = '00000000-0000-4000-8000-000000009001'
                AND c.recipient_type = 'PARENT' AND c.purpose = 'GENERAL'
                AND c.status = 'OPTED_IN'
            ) THEN RAISE EXCEPTION 'Legacy parent consent was not backfilled'; END IF;
            IF EXISTS (
              SELECT 1 FROM role_permissions rp JOIN permissions p ON p.id = rp.permission_id
              WHERE rp.role_id = pdg_role_id AND p.name = 'whatsapp.consent.manage'
            ) THEN RAISE EXCEPTION 'PDG unexpectedly has whatsapp.consent.manage'; END IF;
            IF (
              SELECT count(*) FROM role_permissions rp JOIN permissions p ON p.id = rp.permission_id
              WHERE rp.role_id = pdg_role_id AND p.name IN ('paies.read','paies.create','paies.update')
            ) <> 3 THEN RAISE EXCEPTION 'PDG payroll permissions missing'; END IF;
          END $pdg$;
          SQL

      - name: Verify consent constraints, append-only audit and idempotency
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO roles (name, description) VALUES ('WhatsApp CI', 'Isolated runtime test');
          INSERT INTO users (username, password_hash, role_id)
          SELECT 'whatsapp-ci-user', 'not-a-real-login', id FROM roles WHERE name = 'WhatsApp CI';
          INSERT INTO parents (last_name, first_name) VALUES ('Runtime', 'Fixture');
          INSERT INTO parents (id,last_name,first_name,phone) VALUES
            ('00000000-0000-4000-8000-000000009101','Parent','One','+50937000101'),
            ('00000000-0000-4000-8000-000000009102','Parent','Two','+50937000102'),
            ('00000000-0000-4000-8000-000000009103','Parent','NoConsent','+50937000103')
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO students(id,matricule,last_name,first_name,date_of_birth,status) VALUES
            ('00000000-0000-4000-8000-000000009111','WA-CI-ADULT','Student','Adult','2000-01-01','ACTIVE'),
            ('00000000-0000-4000-8000-000000009112','WA-CI-MINOR','Student','Minor','2012-01-01','ACTIVE'),
            ('00000000-0000-4000-8000-000000009113','WA-CI-UNKNOWN','Student','Unknown',NULL,'ACTIVE')
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO student_parents(student_id,parent_id,relationship_type,is_primary) VALUES
            ('00000000-0000-4000-8000-000000009111','00000000-0000-4000-8000-000000009101','Parent',TRUE),
            ('00000000-0000-4000-8000-000000009111','00000000-0000-4000-8000-000000009102','Guardian',FALSE),
            ('00000000-0000-4000-8000-000000009111','00000000-0000-4000-8000-000000009103','Other',FALSE),
            ('00000000-0000-4000-8000-000000009112','00000000-0000-4000-8000-000000009101','Parent',TRUE),
            ('00000000-0000-4000-8000-000000009112','00000000-0000-4000-8000-000000009102','Guardian',FALSE),
            ('00000000-0000-4000-8000-000000009112','00000000-0000-4000-8000-000000009103','Other',FALSE),
            ('00000000-0000-4000-8000-000000009113','00000000-0000-4000-8000-000000009101','Parent',TRUE),
            ('00000000-0000-4000-8000-000000009113','00000000-0000-4000-8000-000000009102','Guardian',FALSE),
            ('00000000-0000-4000-8000-000000009113','00000000-0000-4000-8000-000000009103','Other',FALSE)
          ON CONFLICT (student_id,parent_id) DO NOTHING;
          INSERT INTO staff(id,first_name,last_name,phone,status)
          VALUES ('00000000-0000-4000-8000-000000009121','Staff','Recipient','+50937000121','ACTIVE')
          ON CONFLICT (id) DO NOTHING;
          INSERT INTO teachers(id,first_name,last_name,phone,status)
          VALUES ('00000000-0000-4000-8000-000000009122','Teacher','Recipient','+50937000122','ACTIVE')
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO whatsapp_recipient_consents
            (recipient_type,parent_id,purpose,phone_e164,status,consent_source,consented_at)
          VALUES
            ('PARENT','00000000-0000-4000-8000-000000009101','GENERAL','+50937000101','OPTED_IN','CI',NOW()),
            ('PARENT','00000000-0000-4000-8000-000000009102','GENERAL','+50937000102','OPTED_IN','CI',NOW())
          ON CONFLICT DO NOTHING;
          INSERT INTO whatsapp_recipient_consents
            (recipient_type,student_id,purpose,phone_e164,status,consent_source,consented_at)
          VALUES ('STUDENT','00000000-0000-4000-8000-000000009111','GENERAL','+50937000111','OPTED_IN','CI',NOW())
          ON CONFLICT DO NOTHING;
          INSERT INTO whatsapp_recipient_consents
            (recipient_type,staff_id,purpose,phone_e164,status,consent_source,consented_at)
          VALUES ('STAFF','00000000-0000-4000-8000-000000009121','GENERAL','+50937000121','OPTED_IN','CI',NOW())
          ON CONFLICT DO NOTHING;
          INSERT INTO whatsapp_recipient_consents
            (recipient_type,teacher_id,purpose,phone_e164,status,consent_source,consented_at)
          VALUES ('TEACHER','00000000-0000-4000-8000-000000009122','GENERAL','+50937000122','OPTED_IN','CI',NOW())
          ON CONFLICT DO NOTHING;
          INSERT INTO whatsapp_recipient_consent_audit
            (consent_id,recipient_type,previous_status,new_status,actor_user_id)
          SELECT c.id,c.recipient_type,NULL,c.status,u.id
          FROM whatsapp_recipient_consents c CROSS JOIN users u
          WHERE u.username='whatsapp-ci-user'
            AND c.phone_e164 IN ('+50937000101','+50937000102','+50937000111','+50937000121','+50937000122');
          INSERT INTO whatsapp_recipient_message_log
            (consent_id,idempotency_key,purpose,status,template_name,payload_sha256,provider_message_id,initiated_by)
          SELECT c.id,'whatsapp-recipient-ci-key-000001','GENERAL','PROCESSING',
                 'ci_template',repeat('c',64),'wamid.whatsapp-ci-test',u.id
          FROM whatsapp_recipient_consents c CROSS JOIN users u
          WHERE c.recipient_type='STUDENT' AND c.student_id='00000000-0000-4000-8000-000000009111'
            AND u.username='whatsapp-ci-user';
          DO $multi$
          BEGIN
            IF (SELECT COUNT(*) FROM whatsapp_recipient_consents
                WHERE recipient_type='PARENT' AND parent_id IN
                  ('00000000-0000-4000-8000-000000009101','00000000-0000-4000-8000-000000009102')
                  AND status='OPTED_IN') <> 2
              THEN RAISE EXCEPTION 'All consented linked parents must be represented'; END IF;
            IF (SELECT COUNT(*) FROM whatsapp_recipient_consents WHERE recipient_type IN ('PARENT','STUDENT','STAFF','TEACHER')) < 5
              THEN RAISE EXCEPTION 'Multi-recipient consent types missing'; END IF;
            BEGIN
              INSERT INTO whatsapp_recipient_message_log
                (consent_id,idempotency_key,purpose,status,template_name,payload_sha256,provider_message_id,initiated_by)
              SELECT c.id,'whatsapp-recipient-ci-key-000001','GENERAL','PROCESSING',
                     'ci_template',repeat('d',64),'wamid.whatsapp-ci-test',u.id
              FROM whatsapp_recipient_consents c CROSS JOIN users u
              WHERE c.recipient_type='STUDENT' AND c.student_id='00000000-0000-4000-8000-000000009111'
                AND u.username='whatsapp-ci-user';
              RAISE EXCEPTION 'Duplicate recipient idempotency key unexpectedly succeeded';
            EXCEPTION WHEN unique_violation THEN
              NULL;
            END;
            IF (SELECT COUNT(*) FROM whatsapp_recipient_message_log) <> 1
              THEN RAISE EXCEPTION 'Recipient message log idempotency failed'; END IF;
            BEGIN
              UPDATE whatsapp_recipient_consent_audit SET new_status='OPTED_OUT';
              RAISE EXCEPTION 'Recipient audit UPDATE unexpectedly succeeded';
            EXCEPTION WHEN raise_exception THEN
              IF SQLERRM = 'Recipient audit UPDATE unexpectedly succeeded' THEN RAISE; END IF;
            END;
          END $multi$;

          INSERT INTO whatsapp_consents
            (parent_id, purpose, phone_e164, status, consent_source, consented_at, created_by, updated_by)
          SELECT p.id, 'GENERAL', '+50937000000', 'OPTED_IN', 'CI fixture', NOW(), u.id, u.id
          FROM parents p CROSS JOIN users u
          WHERE p.first_name = 'Fixture' AND u.username = 'whatsapp-ci-user';

          INSERT INTO whatsapp_consent_audit
            (consent_id, parent_id, purpose, previous_status, new_status, actor_user_id)
          SELECT c.id, c.parent_id, c.purpose, NULL, c.status, u.id
          FROM whatsapp_consents c CROSS JOIN users u
          WHERE u.username = 'whatsapp-ci-user'
            AND c.parent_id = (
              SELECT id FROM parents
              WHERE first_name = 'Fixture' AND last_name = 'Runtime'
              ORDER BY id LIMIT 1
            )
          LIMIT 1;

          INSERT INTO whatsapp_message_log
            (consent_id, idempotency_key, purpose, status, template_name, payload_sha256, initiated_by)
          SELECT c.id, 'whatsapp-ci-key-000001', 'GENERAL', 'SIMULATED',
                 'ci_template', repeat('a', 64), u.id
          FROM whatsapp_consents c CROSS JOIN users u
          WHERE u.username = 'whatsapp-ci-user'
            AND c.parent_id = (
              SELECT id FROM parents
              WHERE first_name = 'Fixture' AND last_name = 'Runtime'
              ORDER BY id LIMIT 1
            )
          LIMIT 1;

          DO $
          BEGIN
            BEGIN
              UPDATE whatsapp_consent_audit SET new_status = 'OPTED_OUT';
              RAISE EXCEPTION 'Audit UPDATE unexpectedly succeeded';
            EXCEPTION WHEN raise_exception THEN
              IF SQLERRM = 'Audit UPDATE unexpectedly succeeded' THEN RAISE; END IF;
            END;

            BEGIN
              DELETE FROM whatsapp_consent_audit;
              RAISE EXCEPTION 'Audit DELETE unexpectedly succeeded';
            EXCEPTION WHEN raise_exception THEN
              IF SQLERRM = 'Audit DELETE unexpectedly succeeded' THEN RAISE; END IF;
            END;

            BEGIN
              TRUNCATE whatsapp_consent_audit;
              RAISE EXCEPTION 'Audit TRUNCATE unexpectedly succeeded';
            EXCEPTION WHEN raise_exception THEN
              IF SQLERRM = 'Audit TRUNCATE unexpectedly succeeded' THEN RAISE; END IF;
            END;

            BEGIN
              INSERT INTO whatsapp_message_log
                (consent_id, idempotency_key, purpose, status, template_name, payload_sha256, initiated_by)
              SELECT c.id, 'whatsapp-ci-key-000001', 'GENERAL', 'SIMULATED',
                     'ci_template', repeat('b', 64), u.id
              FROM whatsapp_consents c CROSS JOIN users u
              WHERE u.username = 'whatsapp-ci-user'
                AND c.parent_id = (
                  SELECT id FROM parents
                  WHERE first_name = 'Fixture' AND last_name = 'Runtime'
                  ORDER BY id LIMIT 1
                )
              LIMIT 1;
              RAISE EXCEPTION 'Duplicate idempotency key unexpectedly succeeded';
            EXCEPTION WHEN unique_violation THEN
              NULL;
            END;

            IF (SELECT count(*) FROM whatsapp_consent_audit) <> 1 THEN
              RAISE EXCEPTION 'Consent audit row count mismatch';
            END IF;
            IF (SELECT count(*) FROM whatsapp_message_log) <> 1 THEN
              RAISE EXCEPTION 'Message log row count mismatch';
            END IF;
          END $$;
          SQL

      - name: Verify age-based recipient resolution without sending messages
        run: php tests/whatsapp-recipient-routing.php

      - name: Verify WhatsApp endpoint PHP syntax
        run: |
          php -l api/whatsapp/consents.php
          php -l api/whatsapp/send.php
          php -l api/whatsapp/manual-preparations.php
          php -l api/whatsapp/recipient-resolver.php
          php -l tests/whatsapp-recipient-routing.php
          php -l api/whatsapp/recipient-consents.php
          php -l api/whatsapp/recipient-search.php
          php -l api/whatsapp/send-multi.php
          php -l api/whatsapp/delivery-status.php
          php -l api/whatsapp/webhook.php
          php -l api/whatsapp/recipient-message-history.php
          php -l private-pages/whatsapp-send.php

      - name: Verify unauthenticated HTTP requests are rejected
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8099 -t . > /tmp/whatsapp-php-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:8099/api/whatsapp/send.php; then
              break
            fi
            sleep 1
          done

          check_unauthenticated() {
            local name="$1"
            local method="$2"
            local path="$3"
            local data="$4"
            local expected="$5"
            local status
            status="$(curl --silent --show-error --output "/tmp/whatsapp-${name}.json" \
              --write-out '%{http_code}' -X "$method" \
              -H 'Content-Type: application/json' \
              --data "$data" "http://127.0.0.1:8099$path")"
            if [ "$status" != "$expected" ]; then
              echo "FAIL $name: expected HTTP $expected, got $status"
              cat "/tmp/whatsapp-${name}.json"
              cat /tmp/whatsapp-php-server.log
              exit 1
            fi
            php -r '$d=json_decode(file_get_contents($argv[1]), true); if (!is_array($d) || ($d["success"] ?? true) !== false) { fwrite(STDERR, "Invalid JSON error response\n"); exit(1); }' "/tmp/whatsapp-${name}.json"
            echo "PASS $name (HTTP $status)"
          }

          check_unauthenticated consent_read GET '/api/whatsapp/consents.php?parent_id=00000000-0000-4000-8000-000000000001' '' 401
          check_unauthenticated consent_write POST '/api/whatsapp/consents.php' '{"parent_id":"00000000-0000-4000-8000-000000000001"}' 401
          check_unauthenticated message_send POST '/api/whatsapp/send.php' '{"parent_id":"00000000-0000-4000-8000-000000000001"}' 401
          check_unauthenticated manual_preparation POST '/api/whatsapp/manual-preparations.php' '{"parent_id":"00000000-0000-4000-8000-000000000001","purpose":"GENERAL","message":"test"}' 401

      - name: Smoke-test manual WhatsApp page
        run: node tests/whatsapp-manual-page-smoke.mjs

      - name: Verify Meta webhook signature, idempotency and delivery lifecycle
        shell: bash
        run: bash tests/whatsapp-webhook-http.sh

      - name: Verify authenticated WhatsApp HTTP lifecycle
        shell: bash
        run: bash tests/whatsapp-authenticated-lifecycle-http.sh

      - name: Verify consent row lock serializes concurrent send and revocation
        shell: bash
        run: bash tests/whatsapp-consent-lock-concurrency.sh
