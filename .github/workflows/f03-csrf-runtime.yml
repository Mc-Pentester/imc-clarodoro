name: F-03 CSRF runtime proof

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  f03-csrf-runtime:
    name: F-03 CSRF protection
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imc_clarodoro
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d imc_clarodoro"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: imc_clarodoro
      DB_USER: postgres
      DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP PostgreSQL extension
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-pgsql postgresql-client jq

      - name: Apply schema
        shell: bash
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:5432/imc_clarodoro" \
            -v ON_ERROR_STOP=1 \
            -f database/schema.sql
          psql "postgresql://postgres:postgres@127.0.0.1:5432/imc_clarodoro" \
            -v ON_ERROR_STOP=1 \
            -f database/migrations/20261006190000_add_login_rate_limit.sql
          psql "postgresql://postgres:postgres@127.0.0.1:5432/imc_clarodoro" \
            -v ON_ERROR_STOP=1 \
            -f database/migrations/20261116193000_student_parent_registration.sql

      - name: Seed F-03 runtime user and permission
        shell: bash
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:5432/imc_clarodoro" \
            -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO roles (id, name)
          VALUES ('00000000-0000-0000-0000-000000000301', 'PDG');

          INSERT INTO permissions (id, name)
          VALUES
            ('00000000-0000-0000-0000-000000000302', 'eleves.create'),
            ('00000000-0000-0000-0000-000000000304', 'eleves.read');

          INSERT INTO role_permissions (role_id, permission_id)
          VALUES
            (
              '00000000-0000-0000-0000-000000000301',
              '00000000-0000-0000-0000-000000000302'
            ),
            (
              '00000000-0000-0000-0000-000000000301',
              '00000000-0000-0000-0000-000000000304'
            );

          INSERT INTO levels (id, code, name)
          VALUES ('00000000-0000-0000-0000-000000000305', 'F03', 'F03 CSRF Runtime Level');

          INSERT INTO classes (id, code, name, level_id, status)
          VALUES ('00000000-0000-0000-0000-000000000306', 'F03-CLASS', 'F03 CSRF Runtime Class',
            '00000000-0000-0000-0000-000000000305', 'ACTIVE');

          INSERT INTO school_years (id, label, start_date, end_date, status)
          VALUES ('00000000-0000-0000-0000-000000000307', 'F03-2026-2027',
            '2026-09-01', '2027-07-15', 'ACTIVE');

          INSERT INTO users (id, username, password_hash, role_id)
          VALUES (
            '00000000-0000-0000-0000-000000000303',
            'f03_csrf_user',
            crypt('CorrectPass123!', gen_salt('bf')),
            '00000000-0000-0000-0000-000000000301'
          );
          SQL

      - name: Start PHP runtime
        shell: bash
        run: |
          set -euo pipefail
          nohup php -d log_errors=1 -d error_log=/tmp/php-error.log -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          echo $! > /tmp/imc-php.pid
          for i in {1..20}; do
            if curl -sS -o /dev/null http://127.0.0.1:8080/api/auth/me.php; then
              break
            fi
            sleep 1
          done
          test -f /tmp/imc-php.pid

      - name: Prove F-03 CSRF protection
        shell: bash
        run: |
          set -euo pipefail

          login() {
            local jar="$1"
            curl -sS -c "$jar" -b "$jar" \
              -H 'Content-Type: application/json' \
              -d '{"username":"f03_csrf_user","password":"CorrectPass123!"}' \
              http://127.0.0.1:8080/api/auth/login.php
          }

          status_with_body() {
            local jar="$1"
            local token="$2"
            local body="$3"
            local output="$4"

            if [ "$token" = "__NONE__" ]; then
              curl -sS -o "$output" -w '%{http_code}' \
                -b "$jar" \
                -H 'Content-Type: application/json' \
                -d "$body" \
                http://127.0.0.1:8080/api/students/index.php
            else
              curl -sS -o "$output" -w '%{http_code}' \
                -b "$jar" \
                -H 'Content-Type: application/json' \
                -H "X-CSRF-Token: $token" \
                -d "$body" \
                http://127.0.0.1:8080/api/students/index.php
            fi
          }

          login /tmp/cookie1.txt > /tmp/login1.json
          login /tmp/cookie2.txt > /tmp/login2.json

          CSRF1="$(jq -r '.csrfToken' /tmp/login1.json)"
          CSRF2="$(jq -r '.csrfToken' /tmp/login2.json)"

          test -n "$CSRF1"
          test -n "$CSRF2"
          test "$CSRF1" != "$CSRF2"

          BODY='{"matricule":"F03-CSRF-001","last_name":"CSRF","first_name":"Proof","class_id":"00000000-0000-0000-0000-000000000306","school_year_id":"00000000-0000-0000-0000-000000000307","parents":[{"first_name":"Marie","last_name":"Parent","ninu":"1234567890","phone":"+50937000001","email":"marie.parent@example.test","address":"Delmas","relationship_type":"MOTHER","is_primary":true}]}'

          STATUS="$(status_with_body /tmp/cookie1.txt __NONE__ "$BODY" /tmp/no-token.json)"
          test "$STATUS" = "403"
          echo "Mutation without CSRF token -> 403: PASS"

          STATUS="$(status_with_body /tmp/cookie1.txt wrong-token "$BODY" /tmp/wrong-token.json)"
          test "$STATUS" = "403"
          echo "Mutation with wrong CSRF token -> 403: PASS"

          STATUS="$(status_with_body /tmp/cookie1.txt "$CSRF2" "$BODY" /tmp/cross-session.json)"
          test "$STATUS" = "403"
          echo "Token from another session -> 403: PASS"

          STATUS="$(status_with_body /tmp/cookie1.txt "$CSRF1" "$BODY" /tmp/valid.json)"
          test "$STATUS" = "201"
          echo "Mutation with valid CSRF token -> 201: PASS"

          # Vérifier la persistance relationnelle réelle, pas seulement profile_data.
          PARENT_ROWS="$(psql "postgresql://postgres:postgres@127.0.0.1:5432/imc_clarodoro" -Atc \
            "SELECT COUNT(*) FROM parents WHERE ninu='1234567890' AND first_name='Marie' AND last_name='Parent'")"
          LINK_ROWS="$(psql "postgresql://postgres:postgres@127.0.0.1:5432/imc_clarodoro" -Atc \
            "SELECT COUNT(*) FROM student_parents sp JOIN students s ON s.id=sp.student_id JOIN parents p ON p.id=sp.parent_id WHERE s.matricule='F03-CSRF-001' AND p.ninu='1234567890' AND sp.relationship_type='MOTHER' AND sp.is_primary=TRUE")"
          test "$PARENT_ROWS" = "1"
          test "$LINK_ROWS" = "1"
          echo "Parent inserted in parents + linked in student_parents: PASS"

          # Un deuxième élève avec le même NINU doit réutiliser la fiche parent.
          BODY2='{"matricule":"F03-CSRF-002","last_name":"Second","first_name":"Student","class_id":"00000000-0000-0000-0000-000000000306","school_year_id":"00000000-0000-0000-0000-000000000307","parents":[{"first_name":"Marie","last_name":"Parent","ninu":"1234567890","phone":"+50937000001","email":"marie.parent@example.test","address":"Delmas","relationship_type":"MOTHER","is_primary":true}]}'
          STATUS="$(status_with_body /tmp/cookie1.txt "$CSRF1" "$BODY2" /tmp/valid-second.json)"
          test "$STATUS" = "201"
          PARENT_ROWS="$(psql "postgresql://postgres:postgres@127.0.0.1:5432/imc_clarodoro" -Atc "SELECT COUNT(*) FROM parents WHERE ninu='1234567890'")"
          LINK_ROWS="$(psql "postgresql://postgres:postgres@127.0.0.1:5432/imc_clarodoro" -Atc "SELECT COUNT(*) FROM student_parents sp JOIN parents p ON p.id=sp.parent_id WHERE p.ninu='1234567890'")"
          test "$PARENT_ROWS" = "1"
          test "$LINK_ROWS" = "2"
          echo "Same parent NINU reused across two students: PASS"

          STATUS="$(curl -sS -o /tmp/get.json -w '%{http_code}' \
            -b /tmp/cookie1.txt \
            http://127.0.0.1:8080/api/students/index.php)"
          test "$STATUS" = "200"
          grep -Fq '"ninu":"1234567890"' /tmp/get.json
          echo "GET returns parent record and NINU: PASS"
          echo "GET without CSRF token -> 200: PASS"

          STATUS="$(curl -sS -o /tmp/logout-no-token.json -w '%{http_code}' \
            -b /tmp/cookie1.txt \
            -X POST \
            http://127.0.0.1:8080/api/auth/logout.php)"
          test "$STATUS" = "403"
          echo "Logout without CSRF token -> 403: PASS"

          STATUS="$(curl -sS -o /tmp/logout-valid.json -w '%{http_code}' \
            -b /tmp/cookie2.txt \
            -H "X-CSRF-Token: $CSRF2" \
            -X POST \
            http://127.0.0.1:8080/api/auth/logout.php)"
          test "$STATUS" = "200"
          echo "Logout with valid CSRF token -> 200: PASS"

          # Prove that a database failure during enrollment is logged safely and
          # that the student + parent writes are rolled back as one transaction.
          psql "postgresql://postgres:postgres@127.0.0.1:5432/imc_clarodoro" \
            -v ON_ERROR_STOP=1 <<'SQL'
          CREATE OR REPLACE FUNCTION f03_force_student_enrollment_failure()
          RETURNS trigger LANGUAGE plpgsql AS $function$
          DECLARE
            student_matricule TEXT;
          BEGIN
            SELECT matricule INTO student_matricule
            FROM students WHERE id = NEW.student_id;
            IF student_matricule = 'F03-FAIL-500' THEN
              RAISE EXCEPTION 'runtime proof failure' USING ERRCODE = 'P0001';
            END IF;
            RETURN NEW;
          END;
          $function$;
          CREATE TRIGGER f03_force_student_enrollment_failure
          BEFORE INSERT ON enrollments
          FOR EACH ROW EXECUTE FUNCTION f03_force_student_enrollment_failure();
          SQL

          FAIL_BODY='{"matricule":"F03-FAIL-500","last_name":"Rollback","first_name":"Proof","class_id":"00000000-0000-0000-0000-000000000306","school_year_id":"00000000-0000-0000-0000-000000000307","parents":[{"first_name":"Rollback","last_name":"Parent","ninu":"1098765432","relationship_type":"MOTHER","is_primary":true}]}'
          STATUS="$(status_with_body /tmp/cookie1.txt "$CSRF1" "$FAIL_BODY" /tmp/failure-500.json)"
          test "$STATUS" = "500"
          grep -Fq '"error":"Erreur interne du serveur"' /tmp/failure-500.json
          if grep -Fq 'runtime proof failure' /tmp/failure-500.json; then
            echo "Internal database detail leaked to HTTP response" >&2
            exit 1
          fi
          # PostgreSQL formats the exception message with driver context, so
          # assert the stable SQLSTATE prefix and the trigger's message rather
          # than matching one exact rendering of the complete log line.
          if ! grep -Eq 'Student creation failed \[SQLSTATE P0001\]: .*runtime proof failure' /tmp/php-error.log; then
            echo "Expected PHP diagnostic was not found."
            echo "--- PHP error log ---"
            if test -f /tmp/php-error.log; then cat /tmp/php-error.log; else echo "MISSING: /tmp/php-error.log"; fi
            echo "--- PHP server log ---"
            cat /tmp/php-server.log || true
            exit 1
          fi
          REMAINING_STUDENTS="$(psql "postgresql://postgres:postgres@127.0.0.1:5432/imc_clarodoro" -Atc "SELECT COUNT(*) FROM students WHERE matricule='F03-FAIL-500'")"
          REMAINING_PARENTS="$(psql "postgresql://postgres:postgres@127.0.0.1:5432/imc_clarodoro" -Atc "SELECT COUNT(*) FROM parents WHERE ninu='1098765432'")"
          test "$REMAINING_STUDENTS" = "0"
          test "$REMAINING_PARENTS" = "0"
          echo "Failed enrollment logs SQLSTATE, hides details, and rolls back student + parent: PASS"

          echo "F-03 CSRF RUNTIME PROOF: PASS"
