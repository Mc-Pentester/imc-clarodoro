name: Windows installer package

on:
  push:
    branches:
      - feature/windows-installer-clarodaro
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    name: Build Inno Setup installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install or locate Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ChocolateyInstall 'lib\innosetup\tools\ISCC.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }

          if (-not $candidates) {
            choco install innosetup --yes --no-progress --force
            if ($LASTEXITCODE -ne 0) {
              throw "Installation Inno Setup échouée (code $LASTEXITCODE)."
            }
          }

          $searchRoots = @(
            $env:ProgramFiles,
            ${env:ProgramFiles(x86)},
            $env:ChocolateyInstall
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }

          $found = foreach ($candidate in $candidates) { $candidate }
          if (-not $found) {
            $found = Get-ChildItem -Path $searchRoots -Filter 'ISCC.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
          }

          $iscc = $found | Select-Object -First 1
          if (-not $iscc -or -not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe introuvable après installation. Répertoires inspectés : $($searchRoots -join ', ')"
          }

          "INNO_SETUP_COMPILER=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Compilateur Inno Setup : $iscc"

      - name: Compile installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:INNO_SETUP_COMPILER -or -not (Test-Path -LiteralPath $env:INNO_SETUP_COMPILER)) {
            throw "Variable INNO_SETUP_COMPILER absente ou invalide."
          }
          & $env:INNO_SETUP_COMPILER 'installer\IMC-Clarodoro.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Compilation Inno Setup échouée (code $LASTEXITCODE)."
          }
          $artifact = 'dist\IMC-Clarodaro-Setup-1.0.0.exe'
          if (-not (Test-Path -LiteralPath $artifact)) {
            throw "Installateur absent : $artifact"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMC-Clarodaro-Windows-Installer
          path: dist/IMC-Clarodaro-Setup-1.0.0.exe
          if-no-files-found: error
          retention-days: 14
