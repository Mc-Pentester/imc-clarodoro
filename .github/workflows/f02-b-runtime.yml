name: F-02-B reference data runtime proof

on:
  push:
    branches: [main]
    paths:
      - 'api/school-years/index.php'
      - 'api/subjects/index.php'
      - 'api/vacations/index.php'
      - 'database/migrations/**'
      - 'database/schema.sql'
      - '.github/workflows/f02-b-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f02-b-runtime:
    name: F-02-B PostgreSQL reference authority
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: imc_clarodoro
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d imc_clarodoro"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: imc_clarodoro
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP PostgreSQL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y php-cli php-pgsql postgresql-client
      - name: Apply schema and migrations
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:5432/imc_clarodoro" -v ON_ERROR_STOP=1 -f database/schema.sql
          php database/migrate.php --apply
          php database/migrate.php --status
          psql "postgresql://postgres:postgres@127.0.0.1:5432/imc_clarodoro" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO roles(id,name) VALUES ('00000000-0000-0000-0000-000000002001','PDG');
          INSERT INTO permissions(name) VALUES
            ('annees.read'),('annees.create'),('annees.update'),
            ('matieres.read'),('matieres.create'),('matieres.update'),
            ('vacances.read'),('vacances.create'),('vacances.update')
          ON CONFLICT (name) DO NOTHING;
          INSERT INTO role_permissions(role_id,permission_id)
          SELECT '00000000-0000-0000-0000-000000002001',id FROM permissions
          WHERE name IN ('annees.read','annees.create','annees.update','matieres.read','matieres.create','matieres.update','vacances.read','vacances.create','vacances.update');
          INSERT INTO users(id,username,password_hash,role_id)
          VALUES ('00000000-0000-0000-0000-000000002011','f02b-runtime',crypt('F02B-Test-2026!',gen_salt('bf')),'00000000-0000-0000-0000-000000002001');
          SQL
      - name: PHP syntax
        run: |
          php -l api/school-years/index.php
          php -l api/subjects/index.php
          php -l api/vacations/index.php
      - name: Start API
        run: |
          nohup php -S 127.0.0.1:8090 -t . >/tmp/f02b-api.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8090/api/health.php >/dev/null 2>&1 && break; sleep 1; done
      - name: Prove PostgreSQL reference authority
        run: |
          set -euo pipefail
          LOGIN="$(curl -fsS -c /tmp/f02b.cookies -b /tmp/f02b.cookies -H 'Content-Type: application/json' -d '{"username":"f02b-runtime","password":"F02B-Test-2026!"}' http://127.0.0.1:8090/api/auth/login.php)"
          CSRF="$(printf '%s' "$LOGIN" | php -r '$d=json_decode(stream_get_contents(STDIN),true); echo $d["csrfToken"]??"";')"
          test -n "$CSRF"
          YEAR="$(curl -fsS -c /tmp/f02b.cookies -b /tmp/f02b.cookies -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d '{"label":"2026-2027","start_date":"2026-09-01","end_date":"2027-07-15","status":"PLANNED"}' http://127.0.0.1:8090/api/school-years/index.php)"
          printf '%s' "$YEAR" | grep -q '"label":"2026-2027"'
          SUBJECT="$(curl -fsS -c /tmp/f02b.cookies -b /tmp/f02b.cookies -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d '{"name":"Mathématiques","coefficient":2}' http://127.0.0.1:8090/api/subjects/index.php)"
          printf '%s' "$SUBJECT" | grep -q '"name":"Mathématiques"'
          VAC="$(curl -fsS -c /tmp/f02b.cookies -b /tmp/f02b.cookies -H "X-CSRF-Token: $CSRF" -H 'Content-Type: application/json' -d '{"name":"Vacances de Noël","start_date":"2026-12-21","end_date":"2027-01-04"}' http://127.0.0.1:8090/api/vacations/index.php)"
          printf '%s' "$VAC" | grep -q '"name":"Vacances de Noël"'
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d imc_clarodoro -Atc "SELECT label FROM school_years WHERE label='2026-2027';" | grep -qx '2026-2027'
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d imc_clarodoro -Atc "SELECT name FROM subjects WHERE name='Mathématiques';" | grep -qx 'Mathématiques'
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d imc_clarodoro -Atc "SELECT name FROM vacations WHERE name='Vacances de Noël';" | grep -qx 'Vacances de Noël'
          echo 'F-02-B RUNTIME PROOF: PASS'

# F-02-B: explicit runtime proof retrigger.
